name: ONVIF image

# Builds the linux/amd64 Docker image with the ONVIF device feature and pushes
# it to GitHub Container Registry as ghcr.io/<owner>/go2rtc-onvif.
# Fires on every push to the onvif branch (watchtower then auto-deploys),
# on v* tags, or manually from the Actions tab.

on:
  workflow_dispatch:
  push:
    branches:
      - 'onvif'
    tags:
      - 'v*'

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      # gate the image on the ONVIF feature tests
      - uses: actions/setup-go@v5
        with: { go-version: '1.25' }
      # internal/streams has a pre-existing upstream test failure (TestTempate),
      # so gate only on the ONVIF packages
      - name: Test ONVIF packages
        run: go test ./internal/onvif/... ./pkg/onvif/...

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/go2rtc-onvif
          tags: |
            type=raw,value=latest
            type=sha,format=short
            type=ref,event=tag

      - uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
